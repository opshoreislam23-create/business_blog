{% extends "base.html" %}

{% block content %}
<h1>My Business Blogs</h1>

{% for p in posts %}
  <div style="border:1px solid #ddd; padding:12px; margin:12px 0; border-radius:8px;">
    <h3>{{ p.slug.replace('_',' ').title() }}</h3>
    <small>{{ p.date }}</small>
    <p>{{ p.preview }}</p>
    <a href="/blog/{{ p.slug }}">Read Blog →</a>
  </div>
{% endfor %}

{% endblock %}
